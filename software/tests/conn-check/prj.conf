CONFIG_PRINTK=y

# Show the driver's init errors on the console
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# Run main above the system workqueue (-1). If the radio's IRQ line gets stuck
# high, the driver's IRQ work runs back to back and would otherwise starve main,
# leaving a silent console in exactly the case this test needs to report.
CONFIG_MAIN_THREAD_PRIORITY=-2
